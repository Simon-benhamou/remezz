
version: "3.9"
services:
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      CORS_ORIGIN: http://localhost:5173
    ports: ["4000:4000"]
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      VITE_API_BASE: http://localhost:4000
      VITE_APP_API_KEY: ${APP_API_KEY}
    ports: ["5173:5173"]
