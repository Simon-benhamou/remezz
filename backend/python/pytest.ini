[pytest]
# Pytest Configuration for Python Modules

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-branch

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    slow: Tests that take longer to execute
    ml: Machine learning model tests
    training: Model training tests
    prediction: Model prediction tests

# Coverage settings
[coverage:run]
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */stubs/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
