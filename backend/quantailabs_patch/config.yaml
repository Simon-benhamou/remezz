# Tunable thresholds for filters, risk, and exits.
risk:
  max_consecutive_losses: 3
  cooldown_minutes: 60
  daily_loss_limit_pct: 3.0        # stop trading if daily equity drawdown <= -3%
  daily_trade_limit: 24
  catastrophic_trade_drawdown_pct: 2.0
  catastrophic_trade_consecutive_losses: 4
  reduce_size_after_losses: true
  size_reduction_after_n_losses: 2 # reduce size after >= 2 losses in a row
  size_reduction_factor: 0.5       # 50% size during recovery
  base_risk_per_trade_pct: 1.0     # % of equity risked per trade (raised for larger per-trade PnL)

fees_slippage:
  taker_fee_bps: 7.5               # 0.075%
  maker_fee_bps: 2.5               # 0.025%
  default_slippage_bps: 2.0        # 0.02% avg slippage

filters:
  min_adx: 12                      # allow entries if ADX >= 12 (crypto momentum is noisier, accept ranging markets)
  min_dollar_volume: 150000        # $150k+ recent liquidity is enough for most pairs
  min_rr: 1.05                     # baseline RR lowered to 1.05R for more opportunities
  min_atr_pct: 0.05                # accept quieter consolidations (ATR% of price) - lowered for low volatility periods
  max_spread_bps: 12               # crypto spreads can expand during chop - increased tolerance
  confidence_threshold: 0.50       # more permissive confidence gate to capture quality setups
  use_confidence_filter: true
  max_atr_pct: 12.0                # keep trading until ATR% becomes extreme
  tier_overrides:
    tier1:
      min_rr: 1.2                  # lowered from 1.3
      min_dollar_volume: 2000000   # lowered from 3M
      max_spread_bps: 10           # increased from 8
      confidence_threshold_delta: 0.00  # no additional confidence requirement
      max_atr_pct: 6.0
    tier2:
      min_dollar_volume: 400000    # lowered from 500k
      min_rr: 1.1                  # lowered from 1.2
      max_spread_bps: 14           # increased from 12
    tier3:
      min_adx: 14                  # lowered from 18 to accept weaker trends
      min_rr: 1.25                 # lowered from 1.4
      min_dollar_volume: 100000    # lowered from 150k
      max_spread_bps: 20           # increased from 18
      confidence_threshold_delta: 0.00  # removed additional confidence requirement
      min_atr_pct_multiplier: 0.4  # lowered from 0.6 to accept lower volatility
      max_atr_pct: 12.0
      spread_atr_ratio_limit: 0.7  # increased from 0.6
  dynamic:
    baseline_atr_multiplier: 0.35    # require ATR to be at least 35% of baseline (lowered from 0.45)
    atr_high_vol_threshold_pct: 1.8  # tighten ADX only when ATR% >= 1.8% (raised from 1.5%)
    atr_high_vol_min_adx: 16         # lowered from 18
    atr_extreme_vol_threshold_pct: 4.5  # raised from 4.0
    atr_extreme_vol_min_adx: 20      # lowered from 22
    atr_extreme_vol_min_rr: 1.25     # lowered from 1.35
    atr_max_pct: 12.0
    atr_max_pct_by_tier:
      tier1: 6.0
      tier2: 9.0
      tier3: 12.0
    spread_atr_ratio_limit: 0.45     # allow spreads up to 45% of ATR% before blocking (raised from 0.35)
    confidence_tier_adjustments:
      tier3: 0.00                    # removed additional confidence requirement
    rr_tier_adjustments:
      tier1: 0.10                    # lowered from 0.15
      tier3: 0.15                    # lowered from 0.20
    momentum_fast_track:
      enabled: true
      min_adx: 30                    # allow strong-flow boost sooner (was 35)
      min_volume_ratio: 1.05         # accept lighter volume expansion (was 1.2)
      min_slope_pct: 0.15            # lower slope requirement (was 0.2)
      min_cmf: 0.02                  # require only mild positive CMF (~2%)
      min_weighted_rr: 0.85          # allow RR relaxation when weighted RR >= 0.85
      min_rr: 1.05                   # never drop below strategy baseline
      rr_floor: 1.0                  # absolute RR floor when fast-track applies
      min_atr_pct: 0.6               # ensure ATR > 0.6% before applying boost
      near_threshold_factor: 0.88    # consider near-miss when within 12%
    aggressiveness_adjustments:
      conservative:
        min_rr_delta: 0.03           # lowered from 0.05
        confidence_delta: 0.01       # lowered from 0.015
      aggressive:
        min_rr_delta: -0.30          # more aggressive (from -0.25)
        min_adx_delta: -4            # more aggressive (from -3)
        confidence_delta: -0.06      # more aggressive (from -0.04)
        min_atr_pct_delta: -0.08     # more aggressive (from -0.06)
    dry_spell:
      enabled: true
      min_minutes_without_trade: 20  # trigger relaxation sooner (from 30)
      rejections_for_step: 3         # relax after fewer rejections (from 4)
      relaxation_step_minutes: 15    # faster relaxation (from 20)
      max_steps: 5                   # allow more relaxation steps (from 4)
      min_adx_delta_per_step: -3.0   # more aggressive relaxation (from -2.5)
      min_rr_delta_per_step: -0.18   # more aggressive relaxation (from -0.15)
      confidence_delta_per_step: -0.04  # more aggressive relaxation (from -0.03)
      min_atr_pct_delta_per_step: -0.05  # more aggressive relaxation (from -0.04)
  playbook_overrides:
    trend_following:
      min_rr: 1.2                    # lowered from 1.35
      min_adx: 15                    # lowered from 18
      min_atr_pct: 0.07              # lowered from 0.1
      confidence_threshold: 0.52     # lowered from 0.58
    momentum_breakout:
      min_rr: 1.35                   # lowered from 1.55
      min_adx: 20                    # lowered from 24
      min_atr_pct: 0.10              # lowered from 0.14
      max_spread_bps: 15             # increased from 12
      confidence_threshold: 0.55     # lowered from 0.6
    mean_reversion:
      min_rr: 1.0                    # lowered from 1.1
      min_atr_pct: 0.04              # lowered from 0.06
      max_spread_bps: 24             # increased from 20
      confidence_threshold: 0.48     # lowered from 0.52

entries:
  ema_fast: 20
  ema_slow: 50
  rsi_period: 14
  adx_period: 14
  cmf_period: 20
  rsi_long_min: 48                 # permissive long threshold (not 50+ only)
  rsi_short_max: 52                # permissive short threshold (symmetry)
  allow_long_with_high_rsi: true   # don't block longs just because RSI is high in uptrend
  allow_short_with_low_rsi: true   # don't block shorts just because RSI is low in downtrend

exits:
  atr_period: 14
  sl_atr_mult: 1.5                 # base SL multiplier (fallback)
  sl_atr_mult_reversal: 1.2        # tighter SL for reversal setups
  sl_atr_mult_impulse: 1.5         # wider SL for impulse setups
  tp_r_multiples: [3.0, 4.5, 6.0]  # push for ≥3R winners so $10 risk yields $30-$50
  trail_after_r: 1.0               # default trailing threshold in R
  trail_after_r_reversal: 0.8      # start trailing earlier on reversals
  trail_after_r_impulse: 1.0       # keep base trailing threshold on impulses
  trail_atr_mult: 1.0              # trail distance ~1x ATR
  max_holding_min: 20              # exit flat if no progress by 20 minutes
  early_exit:
    adx_below: 18
    cmf_negative: true
    tighten_profit_r: 0.2          # tighten stops once 0.2R in profit if momentum fades
    cut_loss_r: 0.35               # exit earlier if -0.35R and momentum fails
  
  # Hybrid Smart Exit Configuration
  # Combines counter-signal awareness, adaptive peak drawdown protection, and technical reversal detection
  # Works with trailing stop as the base strategy (EXIT_STRATEGY_MODE = trailing)
  hybrid:
    # Enable/disable specific features
    enable_counter_signal_exits: true
    enable_peak_drawdown_protection: true
    enable_reversal_detection: true
    
    # Counter-signal awareness (rotation detection)
    counter_signal_exit_confidence: 0.7    # Exit if counter-signal confidence >= 0.7 and R >= 2.0
    counter_signal_exit_min_r: 2.0
    counter_signal_tighten_confidence: 0.6  # Tighten if confidence >= 0.6 and R >= 1.0
    counter_signal_tighten_min_r: 1.0
    
    # Adaptive peak drawdown protection (lock in gains)
    # Thresholds by R-multiple achieved
    peak_drawdown_thresholds:
      1.0: 0.05   # Allow 5% drawdown from peak at 1R
      2.0: 0.04   # Allow 4% drawdown from peak at 2R
      3.0: 0.03   # Allow 3% drawdown from peak at 3R
      5.0: 0.02   # Allow 2% drawdown from peak at 5R+
    
    # Technical reversal detection (multi-indicator)
    reversal_exit_score: 75.0      # Exit if reversal score >= 75 and R >= 2.0
    reversal_exit_min_r: 2.0
    reversal_tighten_score: 60.0   # Tighten if reversal score >= 60 and R >= 1.0
    reversal_tighten_min_r: 1.0
  
  strategy_overrides:
    trend_following:
      trail_after_r: 1.25
      trail_atr_mult: 1.1
      early_exit:
        tighten_profit_r: 0.25
        cut_loss_r: 0.45
        min_hold_minutes: 25
      max_holding_min: 120
    momentum_breakout:
      sl_atr_mult_impulse: 1.35
      trail_after_r: 1.05
      trail_atr_mult: 1.05
      tp_r_multiples: [1.8, 3.0, 4.5]
      early_exit:
        tighten_profit_r: 0.22
        cut_loss_r: 0.4
        min_hold_minutes: 30
      reentry_cooldown_min: 35
    mean_reversion:
      trail_after_r: 0.9
      trail_atr_mult: 0.85
      early_exit:
        tighten_profit_r: 0.15
        cut_loss_r: 0.3
        min_hold_minutes: 15
      max_holding_min: 45

regime:
  ema_trend_period_fast: 50
  ema_trend_period_slow: 200
  adx_trend_min: 16
  neutral_band_bps: 10               # +-0.10% slope per period ~ neutral

# Re-optimization scheduler configuration
reoptimization:
  # Default schedule for all symbols (if not specified individually)
  default_schedule:
    enabled: true
    frequency: 'daily'     # 'daily', 'weekly', or 'custom'
    run_hour: 2            # Hour of day (0-23) for daily schedules
    run_day: 0             # Day of week (0=Sunday) for weekly schedules
    interval_hours: null   # Custom interval in hours (overrides daily/weekly)
  
  # Symbol-specific schedules (override default)
  symbol_schedules:
    BTC/USDT:
      enabled: true
      frequency: 'daily'
      run_hour: 1
    ETH/USDT:
      enabled: true
      frequency: 'daily'
      run_hour: 1
    SOL/USDT:
      enabled: true
      frequency: 'weekly'
      run_day: 1          # Monday
      run_hour: 2
    # Add more symbol-specific schedules as needed
