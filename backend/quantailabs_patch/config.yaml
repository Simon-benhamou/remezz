# Tunable thresholds for filters, risk, and exits.
risk:
  max_consecutive_losses: 3
  cooldown_minutes: 60
  daily_loss_limit_pct: 3.0        # stop trading if daily equity drawdown <= -3%
  daily_trade_limit: 24
  reduce_size_after_losses: true
  size_reduction_after_n_losses: 2 # reduce size after >= 2 losses in a row
  size_reduction_factor: 0.5       # 50% size during recovery
  base_risk_per_trade_pct: 0.5     # % of equity risked per trade (target 0.25–0.75% typical)

fees_slippage:
  taker_fee_bps: 7.5               # 0.075%
  maker_fee_bps: 2.5               # 0.025%
  default_slippage_bps: 2.0        # 0.02% avg slippage

filters:
  min_adx: 14                      # allow entries if ADX >= 14 (crypto momentum is noisier)
  min_dollar_volume: 50000000        # $150k+ recent liquidity is enough for most pairs
  min_rr: 1.15                     # baseline RR so we still target >=1.15R
  min_atr_pct: 0.08                # accept quieter consolidations (ATR% of price)
  max_spread_bps: 8               # crypto spreads can expand during chop
  confidence_threshold: 0.55       # slightly more permissive confidence gate
  use_confidence_filter: true
  max_atr_pct: 12.0                # keep trading until ATR% becomes extreme
  tier_overrides:
    tier1:
      min_rr: 1.3
      min_dollar_volume: 3000000
      max_spread_bps: 8
      confidence_threshold_delta: 0.01
      max_atr_pct: 6.0
    tier2:
      min_dollar_volume: 500000
      min_rr: 1.2
      max_spread_bps: 12
    tier3:
      min_adx: 18
      min_rr: 1.4
      min_dollar_volume: 150000
      max_spread_bps: 18
      confidence_threshold_delta: 0.02
      min_atr_pct_multiplier: 0.6
      max_atr_pct: 12.0
      spread_atr_ratio_limit: 0.6
  dynamic:
    baseline_atr_multiplier: 0.45    # require ATR to be at least 45% of baseline
    atr_high_vol_threshold_pct: 1.5  # tighten ADX only when ATR% >= 1.5%
    atr_high_vol_min_adx: 18
    atr_extreme_vol_threshold_pct: 4.0
    atr_extreme_vol_min_adx: 22
    atr_extreme_vol_min_rr: 1.35
    atr_max_pct: 12.0
    atr_max_pct_by_tier:
      tier1: 6.0
      tier2: 9.0
      tier3: 12.0
    spread_atr_ratio_limit: 0.35     # allow spreads up to 55% of ATR% before blocking
    confidence_tier_adjustments:
      tier3: 0.02
    rr_tier_adjustments:
      tier1: 0.15
      tier3: 0.2
    aggressiveness_adjustments:
      conservative:
        min_rr_delta: 0.05
        confidence_delta: 0.015
      aggressive:
        min_rr_delta: -0.25
        min_adx_delta: -3
        confidence_delta: -0.04
        min_atr_pct_delta: -0.06
    dry_spell:
      enabled: true
      min_minutes_without_trade: 30
      rejections_for_step: 4
      relaxation_step_minutes: 20
      max_steps: 4
      min_adx_delta_per_step: -2.5
      min_rr_delta_per_step: -0.15
      confidence_delta_per_step: -0.03
      min_atr_pct_delta_per_step: -0.04

entries:
  ema_fast: 20
  ema_slow: 50
  rsi_period: 14
  adx_period: 14
  cmf_period: 20
  rsi_long_min: 48                 # permissive long threshold (not 50+ only)
  rsi_short_max: 52                # permissive short threshold (symmetry)
  allow_long_with_high_rsi: true   # don't block longs just because RSI is high in uptrend
  allow_short_with_low_rsi: true   # don't block shorts just because RSI is low in downtrend

exits:
  atr_period: 14
  sl_atr_mult: 1.5                 # base SL multiplier (fallback)
  sl_atr_mult_reversal: 1.2        # tighter SL for reversal setups
  sl_atr_mult_impulse: 1.5         # wider SL for impulse setups
  tp_r_multiples: [2.0, 3.2, 4.6]  # enforce larger upside before scaling out
  trail_after_r: 1.0               # default trailing threshold in R
  trail_after_r_reversal: 0.8      # start trailing earlier on reversals
  trail_after_r_impulse: 1.0       # keep base trailing threshold on impulses
  trail_atr_mult: 1.0              # trail distance ~1x ATR
  max_holding_min: 20              # exit flat if no progress by 20 minutes
  early_exit:
    adx_below: 18
    cmf_negative: true
    tighten_profit_r: 0.2          # tighten stops once 0.2R in profit if momentum fades
    cut_loss_r: 0.35               # exit earlier if -0.35R and momentum fails

regime:
  ema_trend_period_fast: 50
  ema_trend_period_slow: 200
  adx_trend_min: 16
  neutral_band_bps: 10               # +-0.10% slope per period ~ neutral

