# Tunable thresholds for filters, risk, and exits.
risk:
  max_consecutive_losses: 3
  cooldown_minutes: 60
  daily_loss_limit_pct: 3.0        # stop trading if daily equity drawdown <= -3%
  daily_trade_limit: 24
  reduce_size_after_losses: true
  size_reduction_after_n_losses: 2 # reduce size after >= 2 losses in a row
  size_reduction_factor: 0.5       # 50% size during recovery
  base_risk_per_trade_pct: 0.5     # % of equity risked per trade (target 0.25–0.75% typical)

fees_slippage:
  taker_fee_bps: 7.5               # 0.075%
  maker_fee_bps: 2.5               # 0.025%
  default_slippage_bps: 2.0        # 0.02% avg slippage

filters:
  min_adx: 18                      # allow entries only if ADX >= 18 (momentum present)
  min_dollar_volume: 500000        # require $ volume over lookback
  min_rr: 1.3                      # minimum risk-reward to first TP
  min_atr_pct: 0.15                # avoid dead markets (ATR% of price)
  max_spread_bps: 10               # avoid high spread pairs
  confidence_threshold: 0.58       # require p(score) > p* ~ (L+C)/(W+L)
  use_confidence_filter: true
  max_atr_pct: 8.0                 # block entries if ATR% exceeds runaway volatility
  tier_overrides:
    tier1:
      min_rr: 1.5
      min_dollar_volume: 10000000
      max_spread_bps: 7
      confidence_threshold_delta: 0.02
      max_atr_pct: 4.0
    tier2:
      min_dollar_volume: 1000000
    tier3:
      min_adx: 25
      min_rr: 2.0
      min_dollar_volume: 1000000
      max_spread_bps: 15
      confidence_threshold_delta: 0.05
      min_atr_pct_multiplier: 0.8
      max_atr_pct: 9.0
      spread_atr_ratio_limit: 0.4
  dynamic:
    baseline_atr_multiplier: 0.6     # require ATR to be at least 60% of its baseline
    atr_high_vol_threshold_pct: 1.0  # if ATR% >= 1%, tighten ADX requirement
    atr_high_vol_min_adx: 20
    atr_extreme_vol_threshold_pct: 3.0
    atr_extreme_vol_min_adx: 25
    atr_extreme_vol_min_rr: 1.6
    atr_max_pct: 8.0
    atr_max_pct_by_tier:
      tier1: 4.0
      tier2: 6.0
      tier3: 9.0
    spread_atr_ratio_limit: 0.35     # spread% must stay below 35% of ATR%
    confidence_tier_adjustments:
      tier3: 0.05
    rr_tier_adjustments:
      tier1: 0.2
      tier3: 0.5
    aggressiveness_adjustments:
      conservative:
        min_rr_delta: 0.1
        confidence_delta: 0.02
      aggressive:
        min_rr_delta: -0.15
        min_adx_delta: -2
        confidence_delta: -0.02
        min_atr_pct_delta: -0.05
    dry_spell:
      enabled: true
      min_minutes_without_trade: 45
      rejections_for_step: 6
      relaxation_step_minutes: 30
      max_steps: 3
      min_adx_delta_per_step: -1.5
      min_rr_delta_per_step: -0.1
      confidence_delta_per_step: -0.02
      min_atr_pct_delta_per_step: -0.03

entries:
  ema_fast: 20
  ema_slow: 50
  rsi_period: 14
  adx_period: 14
  cmf_period: 20
  rsi_long_min: 48                 # permissive long threshold (not 50+ only)
  rsi_short_max: 52                # permissive short threshold (symmetry)
  allow_long_with_high_rsi: true   # don't block longs just because RSI is high in uptrend
  allow_short_with_low_rsi: true   # don't block shorts just because RSI is low in downtrend

exits:
  atr_period: 14
  sl_atr_mult: 1.5                 # base SL multiplier (fallback)
  sl_atr_mult_reversal: 1.2        # tighter SL for reversal setups
  sl_atr_mult_impulse: 1.5         # wider SL for impulse setups
  tp_r_multiples: [0.5, 1.0, 2.0]  # partial TPs at 0.5R, 1R, 2R
  trail_after_r: 1.0               # default trailing threshold in R
  trail_after_r_reversal: 0.8      # start trailing earlier on reversals
  trail_after_r_impulse: 1.0       # keep base trailing threshold on impulses
  trail_atr_mult: 1.0              # trail distance ~1x ATR
  max_holding_min: 20              # exit flat if no progress by 20 minutes
  early_exit:
    adx_below: 18
    cmf_negative: true
    tighten_profit_r: 0.2          # tighten stops once 0.2R in profit if momentum fades
    cut_loss_r: 0.5                # exit early if -0.5R and momentum fails

regime:
  ema_trend_period_fast: 50
  ema_trend_period_slow: 200
  adx_trend_min: 16
  neutral_band_bps: 10               # +-0.10% slope per period ~ neutral

