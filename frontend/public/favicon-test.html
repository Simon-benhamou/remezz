<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favicon Centering Test</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 40px;
      background: #f3f4f6;
    }
    .favicon-test {
      display: inline-block;
      margin: 20px;
      text-align: center;
    }
    .favicon-preview {
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      padding: 20px;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .grid-overlay {
      position: relative;
      display: inline-block;
    }
    .grid-overlay::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        linear-gradient(to right, rgba(255,0,0,0.1) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,0,0,0.1) 1px, transparent 1px);
      background-size: 8px 8px;
      pointer-events: none;
      z-index: 1;
    }
    h1 {
      color: #2563eb;
      text-align: center;
      margin-bottom: 40px;
    }
    h3 {
      margin: 10px 0 5px 0;
      color: #374151;
    }
  </style>
</head>
<body>
  <h1>🎯 Favicon Centering Test - Remezz</h1>
  
  <div class="favicon-test">
    <div class="favicon-preview">
      <h3>32x32 Favicon</h3>
      <div class="grid-overlay">
        <img src="favicon.svg" width="64" height="64" alt="32x32 favicon">
      </div>
    </div>
  </div>

  <div class="favicon-test">
    <div class="favicon-preview">
      <h3>48x48 Favicon</h3>
      <div class="grid-overlay">
        <img src="favicon-48.svg" width="96" height="96" alt="48x48 favicon">
      </div>
    </div>
  </div>

  <div class="favicon-test">
    <div class="favicon-preview">
      <h3>180x180 Apple Touch</h3>
      <div class="grid-overlay">
        <img src="apple-touch-icon.svg" width="120" height="120" alt="Apple touch icon">
      </div>
    </div>
  </div>

  <div style="margin-top: 40px; text-align: center; color: #6b7280;">
    <p>✅ Le Q devrait maintenant être parfaitement centré dans tous les formats</p>
    <p>🔴 Les lignes rouges de la grille aident à vérifier l'alignement</p>
  </div>
</body>
</html>
