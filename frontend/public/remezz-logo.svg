<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 60" fill="none">
  <defs>
    <linearGradient id="sig" x1="0" y1="0" x2="56" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon: True signal wave - sine wave with growing amplitude -->
  <g transform="translate(2, 4)">
    <!-- Sine wave: starts flat, amplitude builds = signal detected -->
    <path d="M0 26
             C3 26, 5 24, 7 22 C9 20, 11 30, 13 26
             C15 22, 16 18, 19 14 C22 10, 23 42, 26 26
             C29 10, 30 4, 33 4 C36 4, 37 48, 40 48 C43 48, 44 4, 47 4 C50 4, 51 26, 54 26"
          stroke="url(#sig)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
    <path d="M0 26
             C3 26, 5 24, 7 22 C9 20, 11 30, 13 26
             C15 22, 16 18, 19 14 C22 10, 23 42, 26 26
             C29 10, 30 4, 33 4 C36 4, 37 48, 40 48 C43 48, 44 4, 47 4 C50 4, 51 26, 54 26"
          stroke="url(#sig)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Broadcast dot at the end -->
    <circle cx="54" cy="26" r="4" fill="#6366f1" filter="url(#glow)"/>
    <circle cx="54" cy="26" r="2" fill="#fff"/>
  </g>

  <!-- Text: remezz -->
  <text x="72" y="43" font-family="'Inter', -apple-system, system-ui, sans-serif" font-size="38" font-weight="800" letter-spacing="-1.5" fill="#f8fafc">remezz</text>
</svg>
