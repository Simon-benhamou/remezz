name: Test Suite

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Build backend
        working-directory: ./backend
        run: npm run build
      
      - name: Run unit tests
        working-directory: ./backend
        run: npm run test:unit
        continue-on-error: true
      
      - name: Run integration tests
        working-directory: ./backend
        run: npm run test:integration
        continue-on-error: true
      
      - name: Run Jest tests (if any)
        working-directory: ./backend
        run: npm run test:jest || echo "No Jest tests configured yet"
        continue-on-error: true

  python-tests:
    name: Python ML Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install Python dependencies
        working-directory: ./backend/python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run pytest
        working-directory: ./backend/python
        run: pytest -v --tb=short || echo "Some tests may need environment setup"
        continue-on-error: true
      
      - name: Generate coverage report
        working-directory: ./backend/python
        run: pytest --cov=. --cov-report=xml --cov-report=term || true
        continue-on-error: true

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      
      - name: Run tests
        working-directory: ./frontend
        run: npm test -- --run
      
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      
      - name: Run backend linter
        working-directory: ./backend
        run: npm run lint || true
        continue-on-error: true
      
      - name: Run frontend linter
        working-directory: ./frontend
        run: npm run lint || true
        continue-on-error: true
      
      - name: Check backend formatting
        working-directory: ./backend
        run: npm run format || true
        continue-on-error: true
      
      - name: Check frontend formatting
        working-directory: ./frontend
        run: npm run format || true
        continue-on-error: true
